        <path fill="#BEC5CD" d="M5 16h3v6H4v-4h1zM15 16h5v4h-3v2h-2z"/>
        <g class="rifle">
            <path fill="#050C16" d="M17 16h19v2h4v3H20v-2h-3z"/>
