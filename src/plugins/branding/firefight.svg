            </g>
            <g class="arms-b" fill="#5DB43F">
                <path d="M17 13h3v2h2v4h-4v-2h-3v-3h2zM15 15h3v5h2v3h-5v-2h-2v-6zM13 15h3v8h-3z"/>
            </g>
        </g>
    </g>
    <g transform="translate(104 7) scale(.72)">
        <g class="octo-b">
            <path fill="#72C84E" d="M7 1h8v1h3v2h2v3h1v7h-2v2H3v-2H1V7h1V4h2V2h3z"/>
            <path fill="#A9E887" d="M7 2h7v1h3v2H6V3h1z"/>
            <path fill="#D5FAEC" d="M9 6h4v1h1v4h-1v1H9v-1H8V7h1z"/>
            <path fill="#38A7B8" d="M10 8h3v2h-3z"/>
            <g class="arms-a" fill="#5DB43F">
                <path d="M4 13H1v2H0v4h4v-2h3v-3H4zM6 15H3v5H1v3h5v-2h2v-6zM9 15h3v8H9z"/>
            </g>
            <g class="arms-b" fill="#5DB43F">
                <path d="M17 13h3v2h2v4h-4v-2h-3v-3h2zM15 15h3v5h2v3h-5v-2h-2v-6zM13 15h3v8h-3z"/>
            </g>
        </g>
    </g>
    <g class="burst-a" data-accent="" fill="#00FF66" fill-opacity=".8">
        <path d="M82 0h2v4h-2zM69 11h4v2h-4zM96 11h4v2h-4zM82 27h2v4h-2z"/>
