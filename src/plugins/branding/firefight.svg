    </g>
    <path class="muzzle-a" data-accent="" fill="#00FF66" d="M40 16h3v1h2v2h-2v1h-3z"/>
    <path class="muzzle-b" data-accent="" fill="#00FF66" d="M40 16h3v1h2v2h-2v1h-3z"/>
    <path class="shot-a" data-accent="" fill="#00FF66" fill-opacity=".8" d="M43 18h4v1h-4z"/>
    <path class="shot-b" data-accent="" fill="#00FF66" fill-opacity=".8" d="M43 18h4v1h-4z"/>
    <g transform="translate(73 2)">
        <g class="octo-a">
            <path fill="#72C84E" d="M7 1h8v1h3v2h2v3h1v7h-2v2H3v-2H1V7h1V4h2V2h3z"/>
            <path fill="#A9E887" d="M7 2h7v1h3v2H6V3h1z"/>
