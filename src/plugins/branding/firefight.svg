<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 34" shape-rendering="crispEdges">
    <style>
        .soldier { animation: body-bob 2.8s steps(1, end) infinite; }
        .rifle { animation: recoil 2.8s steps(1, end) infinite; }
        .shot-a { animation: shot-a 2.8s linear infinite; }
        .shot-b { animation: shot-b 2.8s linear infinite; }
        .muzzle-a { animation: muzzle-a 2.8s steps(1, end) infinite; }
        .muzzle-b { animation: muzzle-b 2.8s steps(1, end) infinite; }
        .octo-a { animation: octo-a 2.8s linear infinite; }
        .octo-b { animation: octo-b 2.8s linear infinite; }
        .arms-a { animation: arms-a .72s steps(1, end) infinite; }
        .arms-b { animation: arms-b .72s steps(1, end) infinite; }
        .burst-a { animation: burst-a 2.8s linear infinite; }
        .burst-b { animation: burst-b 2.8s linear infinite; }
        @keyframes body-bob {
            0%, 49% { transform: translateY(0); }
            50%, 100% { transform: translateY(1px); }
        }
        @keyframes recoil {
            0%, 5%, 50%, 55% { transform: translateX(-1px); }
            6%, 49%, 56%, 100% { transform: none; }
        }
        @keyframes shot-a {
            0% { transform: translateX(0); opacity: 0; }
            4% { opacity: 1; }
            38% { transform: translateX(35px); opacity: 1; }
            39%, 100% { transform: translateX(35px); opacity: 0; }
        }
        @keyframes shot-b {
            0%, 50% { transform: translateX(0); opacity: 0; }
            54% { opacity: 1; }
            77% { transform: translateX(63px); opacity: 1; }
            78%, 100% { transform: translateX(63px); opacity: 0; }
        }
        @keyframes muzzle-a {
            0%, 5% { opacity: 1; }
            6%, 100% { opacity: 0; }
        }
        @keyframes muzzle-b {
            0%, 49% { opacity: 0; }
            50%, 55% { opacity: 1; }
            56%, 100% { opacity: 0; }
        }
        @keyframes octo-a {
            0% { transform: translateY(-3px); opacity: 0; }
            4% { transform: translateY(-2px); opacity: .2; }
            8% { transform: translateY(-1px); opacity: .45; }
            12% { transform: translateY(0); opacity: .72; }
            16%, 18% { transform: translateY(0); opacity: 1; }
            19%, 37% { transform: translateY(1px); opacity: 1; }
            44% { transform: translateY(0); opacity: .8; }
            51% { transform: translateY(-1px); opacity: .55; }
            58% { transform: translateY(-2px); opacity: .25; }
            65%, 100% { transform: translateY(-3px); opacity: 0; }
        }
        @keyframes octo-b {
            0% { transform: translateY(-2px); opacity: 0; }
            4% { transform: translateY(-1px); opacity: .2; }
            8% { transform: translateY(0); opacity: .45; }
            12% { transform: translateY(1px); opacity: .72; }
            16%, 59% { transform: translateY(1px); opacity: 1; }
            60%, 78% { transform: translateY(0); opacity: 1; }
            84% { transform: translateY(-1px); opacity: .8; }
            90% { transform: translateY(-1px); opacity: .55; }
            96% { transform: translateY(-2px); opacity: .25; }
            100% { transform: translateY(-3px); opacity: 0; }
        }
        @keyframes arms-a {
            0%, 49% { transform: translateX(0); }
            50%, 100% { transform: translateX(-1px); }
        }
        @keyframes arms-b {
            0%, 49% { transform: translateX(-1px); }
            50%, 100% { transform: translateX(0); }
        }
        @keyframes burst-a {
            0%, 36% { opacity: 0; }
            37% { opacity: 1; }
            44% { opacity: .75; }
            53% { opacity: .35; }
            62%, 100% { opacity: 0; }
        }
        @keyframes burst-b {
            0%, 77% { opacity: 0; }
            78% { opacity: 1; }
            84% { opacity: .75; }
            91% { opacity: .35; }
            98%, 100% { opacity: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; }
            .shot-a, .shot-b, .muzzle-a, .muzzle-b, .burst-a, .burst-b { display: none; }
        }
    </style>
    <g class="soldier">
        <g transform="translate(18 0) scale(-1 1)">
            <path fill="#050C16" d="M5 1h6v1h2v2h1v2h2v3h-1v4h-2v2h-2v1H5v-1H3v-2H2V9H0V6h3V4h1V2h1z"/>
